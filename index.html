<!DOCTYPE html>
<html>
<head>
    <title>AI Civil Planner 2D</title>

    <style>

        body{
            font-family:Arial;
            text-align:center;
            background:#f4f4f4;
            margin:0;
            padding:50px;
        }

        .container{
            background:white;
            max-width:600px;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,.1);
        }

      input, select{
    width:90%;
    padding:10px;
    margin:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
}

        button{
            background:#0078d4;
            color:white;
            border:none;
            padding:12px 20px;
            cursor:pointer;
            border-radius:5px;
        }

        canvas{
            margin-top:20px;
            border:1px solid black;
            background:white;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🏠 AI House Plan Generator</h1>

    <p>Enter plot dimensions</p>

    <input id="plotLength" type="number" placeholder="Plot Length (ft)">

<input id="plotWidth" type="number" placeholder="Plot Width (ft)">

<select id="houseType">
    <option>1 RK</option>
    <option>1 BHK</option>
    <option>2 BHK</option>
    <option>3 BHK</option>
    <option>4 BHK</option>
</select>

<select id="frontDirection">
    <option>North Facing</option>
    <option>South Facing</option>
    <option>East Facing</option>
    <option>West Facing</option>
</select>

<select id="roadDirection">
    <option>Road North</option>
    <option>Road South</option>
    <option>Road East</option>
    <option>Road West</option>
</select>

<select id="staircase">
    <option>Inside Staircase</option>
    <option>Outside Staircase</option>
</select>

<select id="attachedBath">
    <option>Attached Bathroom Required</option>
    <option>No Attached Bathroom</option>
</select>

<select id="parking">
    <option>Parking Required</option>
    <option>No Parking</option>
</select>
    <br>

    <button onclick="generatePlan()">
        Generate Plan
    </button>

    <br><br>

    <canvas id="plan" width="500" height="500"></canvas>

</div>

<script>

function generatePlan(){

let length=document.getElementById("plotLength").value;
let width=document.getElementById("plotWidth").value;

let houseType=document.getElementById("houseType").value;
let staircase=document.getElementById("staircase").value;
let parking=document.getElementById("parking").value;
let attachedBath=document.getElementById("attachedBath").value;

let canvas=document.getElementById("plan");
let ctx=canvas.getContext("2d");

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.font="14px Arial";

ctx.strokeRect(20,50,450,380);

ctx.fillText(
"Plot Size : "+length+" x "+width+" ft",
150,
25
);

if(parking.includes("Required")){
    ctx.strokeRect(20,50,120,70);
    ctx.fillText("Parking",50,90);
}

ctx.strokeRect(150,230,250,100);
ctx.fillText("Hall",255,285);

if(houseType==="1 RK"){

    ctx.strokeRect(150,80,250,120);
    ctx.fillText("Room + Kitchen",220,145);

}

if(houseType==="1 BHK"){

    ctx.strokeRect(20,140,180,80);
    ctx.fillText("Bedroom",70,185);

    ctx.strokeRect(220,140,180,80);
    ctx.fillText("Kitchen",280,185);

}

if(houseType==="2 BHK" || houseType==="3 BHK" || houseType==="4 BHK"){

    ctx.strokeRect(20,140,180,80);
    ctx.fillText("Bedroom 1",70,185);

    ctx.strokeRect(220,140,180,80);
    ctx.fillText("Bedroom 2",270,185);

}

if(houseType==="3 BHK" || houseType==="4 BHK"){

    ctx.strokeRect(20,340,180,70);
    ctx.fillText("Bedroom 3",65,380);

}

if(houseType==="4 BHK"){

    ctx.strokeRect(220,340,180,70);
    ctx.fillText("Bedroom 4",265,380);

}

if(attachedBath.includes("Attached")){

    ctx.strokeRect(400,230,70,100);
    ctx.fillText("Bath",415,285);

}

if(staircase.includes("Inside")){

    ctx.strokeRect(400,80,70,80);
    ctx.fillText("Stairs",410,125);

}
else{

    ctx.strokeRect(20,230,100,100);
    ctx.fillText("Outside",35,285);

}

}

</script>
</body>
</html>
